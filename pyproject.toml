[project]
name = "ai-code-review"
version = "0.1.0"
description = "AI-powered GitHub PR code review using LLaMA-3, Tree-sitter, and FastAPI"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Settings management — reads from .env file
    "pydantic-settings>=2.2.0",

    # GitHub API client
    "PyGithub>=2.3.0",

    # LLM providers
    "groq>=0.9.0",
    "httpx>=0.27.0",

    # Code parsing (tree-sitter-languages has no Python 3.13 wheels; use official packages)
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
